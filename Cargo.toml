[package]
name = "agent-memory"
version = "0.1.0"
edition = "2021"
rust-version = "1.85"
description = "Self-hosted MCP memory server for AI agents: SQLite-backed, HTTP-only, shared by multiple agents, with an embedded Vue3 management UI."
license = "MIT"
repository = "https://github.com/Leawind/agent-memory"
homepage = "https://github.com/Leawind/agent-memory"
readme = "README.md"
keywords = ["mcp", "memory", "ai", "sqlite", "http-server"]
categories = ["database", "development-tools", "web-programming::http-server"]

# 发布即交付完整管理界面：ui/dist 虽不入 git（构建产物），但发布流程先跑
# `pnpm build` 产出 dist，include 把它打进 .crate 包，用户 cargo install 时
# rust-embed 直接嵌入，无需 node。白名单语义：新增目录须显式登记。
# 注意：发布前必须删除各处 node_modules——pnpm 在 Windows 上以 junction 链接
# 依赖包，cargo 的打包遍历会跟进 junction 把 node_modules 吸进 .crate，
# include/exclude 均拦不住（见 .github/workflows/release.yml 的处理）。
include = [
    "src/**",
    "migrations/**",
    "sql/**",
    "ui/dist/**",
    "build.rs",
    "Cargo.toml",
    "Cargo.lock",
    "README.md",
    "LICENSE",
    "CHANGELOG.md",
]

[dependencies]
clap = { version = "4.5.61", features = ["derive"] }
regex = "1"
rusqlite = { version = "0.40.2", features = ["bundled"] }
rust-embed = { version = "8.12.0", features = ["debug-embed"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tiny_http = "0.12"
# 出站 HTTP（语义搜索的 embedding 服务调用）：同步、rustls TLS，刻意保持最小
ureq = { version = "2", features = ["json"] }

# 提交前 `cargo clippy --all-targets -- -D warnings` 会把这些当错误处理
[lints.clippy]
dbg_macro = "warn"
todo = "warn"
uninlined_format_args = "warn"
format_push_string = "warn"
wildcard_dependencies = "warn"
redundant_clone = "warn"
needless_collect = "warn"
manual_let_else = "warn"
match_bool = "warn"
pathbuf_init_then_push = "warn"
bool_to_int_with_if = "warn"
cloned_instead_of_copied = "warn"
flat_map_option = "warn"

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
strip = true
