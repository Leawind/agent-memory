[package]
name = "agent-memory"
version = "0.3.0"
edition = "2021"
rust-version = "1.82"
description = "Self-hosted, low-footprint MCP memory server for AI agents: tags + summaries + full content, progressive disclosure, keyword search."

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
strip = true
