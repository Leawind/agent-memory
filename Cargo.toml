[package]
name = "agent-memory"
version = "0.1.0"
edition = "2021"
rust-version = "1.85"
description = "Self-hosted MCP memory server for AI agents: SQLite-backed, HTTP-only, shared by multiple agents, with an embedded Vue3 management UI."

[dependencies]
clap = { version = "4.5.61", features = ["derive"] }
rusqlite = { version = "0.40.2", features = ["bundled"] }
rust-embed = { version = "8.12.0", features = ["debug-embed"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tiny_http = "0.12"

# 提交前 `cargo clippy --all-targets -- -D warnings` 会把这些当错误处理
[lints.clippy]
dbg_macro = "warn"
todo = "warn"
uninlined_format_args = "warn"
format_push_string = "warn"
wildcard_dependencies = "warn"
redundant_clone = "warn"
needless_collect = "warn"
manual_let_else = "warn"
match_bool = "warn"
pathbuf_init_then_push = "warn"
bool_to_int_with_if = "warn"
cloned_instead_of_copied = "warn"
flat_map_option = "warn"

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
strip = true
