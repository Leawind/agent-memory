name: release

# 发布流程：先构建前端（ui/dist 必须随 .crate 包分发，见 Cargo.toml include），
# 再 cargo publish。用户侧 cargo install agent-memory 时 rust-embed 直接嵌入
# 包内 dist，无需 node。
on:
  push:
    tags:
      - "v*"

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - uses: dtolnay/rust-toolchain@stable
      # cargo test 与 cargo publish 各自完整编译依赖树，缓存收益同样明显
      - uses: Swatinem/rust-cache@v2
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      # 唯一的自动正确性闸门：check/ui 均为手动触发，tag 可能打在未过 CI 的提交上，
      # 发布前必须实际跑一遍测试（e2e 真实启动服务器，dev profile 嵌入刚构建的 dist）
      - run: cargo test --locked
      # 打包前必须删除 node_modules：pnpm 在 Windows 上用 NTFS junction 链接包，
      # cargo 的打包遍历会跟进 junction 把整个 node_modules 吸进 .crate
      # （include/exclude 均拦不住），产物从 ~90 文件膨胀到 3300+。构建完成后
      # node_modules 不再需要，删除后 cargo package 的文件清单即回归干净。
      - run: rm -rf node_modules ui/node_modules ui/lib/node_modules ui/app/node_modules scripts/node_modules
      # 发布前人工核对包内容：ui/dist 必须在列，node_modules 必须不在列
      - run: test -z "$(cargo package --list --locked | grep node_modules)" && cargo package --list --locked | grep -q "ui/dist/index.html"
      - run: cargo publish --locked
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
