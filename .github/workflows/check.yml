name: check

# Actions 额度有限：不做 push/PR 自动触发，按需手动运行
# （GitHub UI 的 Run workflow 按钮，或 `gh workflow run check.yml`）。
# 发布正确性由 release workflow 的 cargo test 兜底，日常提交不强制过 CI。
on:
  workflow_dispatch:

jobs:
  check:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: Format
        run: cargo fmt --check
      - name: Clippy
        run: cargo clippy --all-targets --locked -- -D warnings
      - name: Tests
        run: cargo test --locked

  msrv:
    # 校验 Cargo.toml 声明的 rust-version 真实可用，防止意外引入更新的 std API
    # （依赖树的实际最大 MSRV 为 1.85：clap 4.6 与 rusqlite 侧的 hashbrown/sha2 栈）
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.85.0
      - run: cargo check
