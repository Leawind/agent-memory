name: ui

# 与 check.yml 同理：Actions 额度有限，前端检查按需手动运行
# （`gh workflow run ui.yml`），不做 push/PR 自动触发。
on:
  workflow_dispatch:

jobs:
  ui-tests:
    # 管理界面的类型检查与单元测试（查询串组装、API 封装、Markdown 渲染消毒）。
    # node 版本须与构建 dist/ 时一致（24），否则产物可能漂移。
    # ui/ 与 scripts/ 由 pnpm-workspace.yaml 统一管理：
    # 根目录一次 pnpm install，typecheck 用 -r 覆盖三个包。
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm format:check
      - run: pnpm typecheck
      - run: pnpm test
