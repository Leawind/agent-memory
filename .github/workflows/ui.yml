name: ui

on:
  push:
  pull_request:

jobs:
  ui-tests:
    # 管理界面的类型检查与单元测试（查询串组装、API 封装、Markdown 渲染消毒）。
    # node 版本须与构建 dist/ 时一致（24），否则产物可能漂移。
    # ui/ 与 scripts/ 由根 package.json 的 npm workspaces 统一管理：
    # 根目录一次 npm ci，typecheck 通过 --workspaces 覆盖两个包。
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: package-lock.json
      - run: npm ci
      - run: npm run format:check
      - run: npm run typecheck
      - run: npm test
